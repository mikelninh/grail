[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grail-collector-intelligence"
version = "0.1.0"
description = "Evidence-first collector intelligence for VeVe, StackR, OMI and Collect Chain"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grail-demo = "grail.demo:main"
