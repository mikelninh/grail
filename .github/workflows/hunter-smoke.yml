name: hunter-smoke

on:
  push:
    branches: ["sprint/v06-hunter", "sprint/v07-personal-hunter", "sprint/v071-personal-actions", "sprint/v072-presets"]
    paths:
      - "dashboard/**"
      - "scripts/**"
      - "src/grail/**"
      - "api/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/hunter-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Build live Hunter bundle
        run: python scripts/build_pages.py
      - name: Build Personal Hunter standalone
        run: python scripts/build_personal_standalone.py
      - name: Validate Hunter preset UX and privacy contract
        run: |
          test -s share/grail-personal-hunter.html
          grep -q "GRAIL v0.7.2" share/grail-personal-hunter.html
          grep -q "Best Overall" share/grail-personal-hunter.html
          grep -q "Grail Hunter" share/grail-personal-hunter.html
          grep -q "Value Hunter" share/grail-personal-hunter.html
          grep -q "Low Mint" share/grail-personal-hunter.html
          grep -q "Iconic Numbers" share/grail-personal-hunter.html
          grep -q "Sleeper" share/grail-personal-hunter.html
          grep -q "Liquid" share/grail-personal-hunter.html
          grep -q "Moonshot" share/grail-personal-hunter.html
          grep -q "Friend Radar" share/grail-personal-hunter.html
          grep -q "Custom" share/grail-personal-hunter.html
          grep -q "Under \$25" share/grail-personal-hunter.html
          grep -q "Conservative" share/grail-personal-hunter.html
          grep -q "Medium+" share/grail-personal-hunter.html
          grep -q "≥25% below" share/grail-personal-hunter.html
          grep -q "Hide mine" share/grail-personal-hunter.html
          grep -q "Show watched first" share/grail-personal-hunter.html
          grep -q "Friend | 0x12...abcd" share/grail-personal-hunter.html
          ! grep -q "Dorian" share/grail-personal-hunter.html
          ! grep -q "0x67" share/grail-personal-hunter.html
      - name: Validate decision-layer data contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/opportunities.json').read_text())
          eligible=[r for r in p['candidates'] if r.get('live_status')=='live' and r.get('signal_class') in {'GRAIL','EDGE','WATCH'} and r.get('actionability')!='reject-price']
          assert eligible
          assert len(eligible) >= 3
          print({'eligible_live':len(eligible),'errors':p.get('errors',[])})
          PY
