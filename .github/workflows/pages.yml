name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "api/**"
      - "src/grail/**"
      - "data/watchlist.json"
      - "data/token_mappings.json"
      - "data/provider_owner_targets.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Build live market, sales, inventory and evidence graph
        run: python scripts/build_pages.py
      - name: Enrich provider-chain ownership golden cases
        run: python scripts/enrich_provider_ownership.py
      - name: Discover evidence-backed exact token mappings
        continue-on-error: true
        run: python scripts/discover_golden_mappings.py
      - name: Promote discovered mapping registry for this build
        run: mv data/token_mappings.next.json data/token_mappings.json
      - name: Resolve exact Collect Chain owners and transfers where mapped
        run: python scripts/enrich_ownership.py
      - name: Update forward-test alpha ledger
        run: python scripts/build_forward.py
      - name: Persist evidence state
        run: |
          mv data/forward_state.next.json data/forward_state.json
          mv data/inventory_state.next.json data/inventory_state.json
          git config user.name "grail-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_state.json data/inventory_state.json data/token_mappings.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update GRAIL evidence state [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
