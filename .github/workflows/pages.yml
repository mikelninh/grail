name: pages

# GRAIL production data/build pipeline. GitHub Pages remains a secondary host;
# the canonical share artifact is share/grail-personal-hunter.html.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "api/**"
      - "src/grail/**"
      - "data/watchlist.json"
      - "data/token_mappings.json"
      - "data/provider_owner_targets.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Build live market, sales, inventory and evidence graph
        run: python scripts/build_pages.py
      - name: Enrich provider-chain ownership golden cases
        run: python scripts/enrich_provider_ownership.py
      - name: Resolve exact Collect Chain owners and transfers from verified registry
        run: python scripts/enrich_ownership.py
      - name: Update forward-test alpha ledger
        run: python scripts/build_forward.py
      - name: Build Personal Hunter standalone
        run: python scripts/build_personal_standalone.py
      - name: Publish immutable static entrypoints
        run: |
          cp site/index.html site/hunter-v061-static.html
          cp site/research.html site/research-v061-static.html
      - name: Persist evidence and standalone Hunter without blocking deploy
        continue-on-error: true
        run: |
          mv data/forward_state.next.json data/forward_state.json
          mv data/inventory_state.next.json data/inventory_state.json
          git config user.name "grail-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_state.json data/inventory_state.json share/grail-personal-hunter.html
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh GRAIL evidence + Personal Hunter [skip ci]"
            git push || echo "Evidence/share push raced with a newer main commit; deploy continues and next run will reconcile."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-health:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify public immutable Hunter, research and data endpoints
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking ${PAGE_URL}"
          for attempt in 1 2 3 4 5 6; do
            html=$(curl -fsSL --max-time 20 "${PAGE_URL}hunter-v061-static.html?health=${GITHUB_RUN_ID}" || true)
            research=$(curl -fsSL --max-time 20 "${PAGE_URL}research-v061-static.html?health=${GITHUB_RUN_ID}" || true)
            json=$(curl -fsSL --max-time 20 "${PAGE_URL}data/opportunities.json?health=${GITHUB_RUN_ID}" || true)
            if [[ "$html" == *"Three things worth your attention."* && "$html" == *"data-static=\"true\""* && "$research" == *"GRAIL Research"* && "$json" == *'"candidates"'* ]]; then
              echo "PUBLIC HEALTH PASS on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} not healthy yet; retrying"
            sleep 10
          done
          echo "PUBLIC HEALTH FAIL: immutable Hunter endpoints are unhealthy"
          exit 1
