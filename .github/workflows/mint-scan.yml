name: mint-scan

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feat/mint-sniper-v0.3"
    paths:
      - "src/grail/mint_live.py"
      - "src/grail/mint_scan.py"
      - "data/watchlist.json"
      - ".github/workflows/mint-scan.yml"
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run edition-level mint sniper
        run: python -m grail.mint_scan --watchlist data/watchlist.json --output artifacts/latest_mint_scan.json --report artifacts/latest_mint_scan.md --top 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grail-mint-scan
          path: |
            artifacts/latest_mint_scan.json
            artifacts/latest_mint_scan.md
          if-no-files-found: warn
          retention-days: 14
