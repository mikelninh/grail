name: provider-research

on:
  push:
    branches: ["sprint/v08-universe-expansion"]
    paths:
      - "src/grail/provider_edition.py"
      - "scripts/discover_catalog_contract.py"
      - ".github/workflows/provider-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Discover public catalog contract
        run: python scripts/discover_catalog_contract.py | tee catalog-contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-contract-research
          path: catalog-contract.txt
          retention-days: 7
