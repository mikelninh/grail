name: provider-research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Discover public catalog contract
        run: python scripts/discover_catalog_contract.py | tee catalog-contract.txt
      - name: Probe market-wide listings RPC
        run: python scripts/probe_market_rpc.py | tee market-rpc.txt
      - name: Probe paginated registry RPC
        run: python scripts/probe_registry_rpc.py | tee registry-rpc.txt
      - uses: actions/upload-artifact@v4
        with:
          name: universe-research
          path: |
            catalog-contract.txt
            market-rpc.txt
            registry-rpc.txt
          retention-days: 7
