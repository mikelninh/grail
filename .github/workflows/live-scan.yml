name: live-scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run live GRAIL watchlist scan
        run: python -m grail.live_scan --watchlist data/watchlist.json --output artifacts/latest_scan.json --top 10
      - uses: actions/upload-artifact@v4
        with:
          name: grail-live-scan
          path: artifacts/latest_scan.json
          retention-days: 14
