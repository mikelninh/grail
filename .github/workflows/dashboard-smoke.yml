name: dashboard-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/dashboard-v1"
    paths:
      - "api/**"
      - "dashboard/**"
      - "src/grail/mint_live.py"
      - "data/watchlist.json"
      - ".github/workflows/dashboard-smoke.yml"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Build live opportunity payload
        run: |
          python - <<'PY'
          import json
          from api.opportunities import build_payload
          p = build_payload(limit=180)
          print(json.dumps({
            'counts': p['counts'],
            'rows': len(p['candidates']),
            'stackr_links': sum(bool(x.get('stackr_url')) for x in p['candidates']),
            'veve_links': sum(bool(x.get('veve_url')) for x in p['candidates']),
            'images': sum(bool(x.get('image_url')) for x in p['candidates']),
            'errors': p['errors'],
          }, indent=2))
          assert len(p['candidates']) >= 10, 'expected real edition-level rows'
          assert any(x.get('stackr_url') for x in p['candidates']), 'no sourced StackR shortcuts found'
          assert any(x.get('image_url') for x in p['candidates']), 'no collectible images found'
          with open('dashboard-smoke.json','w') as f:
            json.dump(p, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grail-dashboard-smoke
          path: dashboard-smoke.json
          retention-days: 14
