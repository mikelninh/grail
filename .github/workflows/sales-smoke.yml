name: sales-smoke

on:
  push:
    branches: ["feat/sales-graph-v2"]
    paths:
      - "src/grail/sales.py"
      - "scripts/build_pages.py"
      - "tests/test_sales.py"
      - ".github/workflows/sales-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Build live sales-aware graph
        run: python scripts/build_pages.py | tee sales-build.txt
      - name: Verify realised-sale evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/opportunities.json').read_text())
          s=json.loads(Path('site/data/sales.json').read_text())
          g=json.loads(Path('site/data/graph.json').read_text())
          goofy=[x for x in p['candidates'] if 'Goofy Became Spider-Man' in x['collectible'] and x['mint'] in (323,825)]
          print({'sales':len(s['sales']),'premium_stats':s['premium_stats'],'graph':g['stats'],'goofy_323_825':[(x['mint'],x['signal_class'],x.get('availability_status')) for x in goofy],'errors':s['errors']})
          assert len(s['sales']) > 10, 'expected live realised sales'
          assert g['stats']['sales'] == len(s['sales'])
          assert g['stats']['nodes'] > 150 and g['stats']['edges'] > 200
          assert all(x['signal_class'] not in ('GRAIL','EDGE','WATCH') for x in goofy), 'sold Goofy editions must not remain actionable'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grail-sales-smoke
          path: site/data
          retention-days: 14
